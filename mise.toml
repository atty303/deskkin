min_version = "2026.8.6"

[tools]
age = "1.3.1"
actionlint = "1.7.12"
clang = "15.0.7"
"conda:libclang" = "15.0.7"
cmake = "3.28.6"
hk = "1.55.0"
ninja = "1.13.2"
python = "3.12.14"
rust = { version = "1.95.0", components = "clippy,rustfmt", targets = "thumbv7m-none-eabi,riscv32i-unknown-none-elf" }
taplo = "0.10.0"
"cargo:espup" = "0.17.1"

[env]
HK_MISE = 1

[hooks]
postinstall = "hk install --mise"

[tool_config]
locked = true

[tasks.check]
description = "Check the repository or selected files"
run = '''
#!/usr/bin/env bash
set -euo pipefail
if (( $# > 0 )); then
  exec hk check --safe -- "$@"
fi
exec hk check --all --safe
'''

[tasks.fix]
description = "Fix the repository or selected files without staging changes"
run = '''
#!/usr/bin/env bash
set -euo pipefail
if (( $# > 0 )); then
  exec hk fix --safe --no-stage -- "$@"
fi
exec hk fix --all --safe --no-stage
'''

[tasks.test]
description = "Run all reproducible checks"
depends = ["check"]
run = '''
#!/usr/bin/env bash
set -euo pipefail
cargo clippy --locked --workspace --all-targets -- -D warnings
cargo test --locked --workspace
cargo run --locked --quiet --bin deskkin-scenario -- periodic-success --recording-off
cargo run --locked --quiet --bin deskkin-scenario -- periodic-read-failure --recording-off
cargo run --locked --quiet --bin deskkin-scenario -- protocol-disconnect-recovery --recording-off
cargo check --locked -p application-core --target thumbv7m-none-eabi
cargo check --locked -p deskkin-protocol --target thumbv7m-none-eabi
cargo check --locked -p deskkin-protocol-client --target thumbv7m-none-eabi
cargo check --locked -p deskkin-core-s3 --target thumbv7m-none-eabi
DESKKIN_TEST_AGE=1 python -m unittest discover -s tests
python scripts/phase3_device.py build
cargo tree --locked -p application-core --edges normal
cargo tree --locked -p deskkin-protocol --edges normal
'''

[tasks."phase2:desktop"]
description = "Run the native Linux periodic status simulator"
run = "cargo run --locked --bin deskkin-desktop"

[tasks."phase2:scenario"]
description = "Run a deterministic Phase 2 headless scenario"
run = "cargo run --locked --quiet --bin deskkin-scenario --"

[tasks."phase2:diagnostics"]
description = "Administer bounded local Phase 2 diagnostic runs"
run = "cargo run --locked --quiet --bin deskkin-diagnostics --"

[tasks."phase3:host"]
description = "Run one explicit Phase 3 desktop-host command"
run = "cargo run --locked --quiet -p deskkin-desktop-host --bin deskkin-desktop-host --"

[tasks."phase3:simulator"]
description = "Run one explicit Phase 3 device-simulator command"
run = "cargo run --locked --quiet -p deskkin-simulator --bin deskkin-desktop --"

[tasks."phase3:diagnostics"]
description = "Administer one exact Phase 3 role diagnostic store"
run = "cargo run --locked --quiet -p deskkin-simulator --bin deskkin-diagnostics --"

[tasks."phase3:device:profile"]
description = "Create the ignored age-encrypted Phase 3P Wi-Fi profile"
run = "python scripts/phase3_device.py profile"

[tasks."phase3:device:bootstrap"]
description = "Prepare the repository-local CoreS3 Zephyr and Rust toolchains"
run = "./scripts/bootstrap_core_s3.sh"

[tasks."phase3:device:build"]
description = "Build the Phase 3P CoreS3 firmware without touching a device"
run = "python scripts/phase3_device.py build"

[tasks."phase3:device:flash"]
description = "Flash the approved Phase 3P firmware after a live checkpoint"
run = "python scripts/phase3_device.py flash"

[tasks."phase3:device:identity"]
description = "Run one explicit CoreS3 identity control command"
run = "python scripts/phase3_device.py identity"

[tasks."phase3:device:provision"]
description = "Provision one CoreS3 Wi-Fi profile after a live checkpoint"
run = "python scripts/phase3_device.py provision"

[tasks."phase3:device:status"]
description = "Read the CoreS3 boot and application status without mutation"
run = "python scripts/phase3_device.py status"

[tasks."phase3:device:run"]
description = "Start the already configured CoreS3 application"
run = "python scripts/phase3_device.py run"

[tasks."phase3:device:recover"]
description = "Erase CoreS3 storage and restore inert firmware after a live checkpoint"
run = "python scripts/phase3_device.py recover"

[tasks."gate:1a:bootstrap"]
description = "Prepare the repository-local Gate 1A Zephyr workspace and SDK"
run = "./scripts/bootstrap_gate1a.sh"

[tasks."gate:1a"]
description = "Run the Rust, Zephyr, and Embassy feasibility gate on supported QEMU targets"
run = "python scripts/gate_runner.py run"

[tasks."gate:1b"]
description = "Run the Slint software-renderer feasibility gate on QEMU and the host"
run = "python scripts/gate1b_runner.py"

[tasks."gate:1c:bootstrap"]
description = "Prepare the repository-local Gate 1C Xtensa toolchains and modules"
run = "./scripts/bootstrap_gate1c.sh"

[tasks."gate:1c"]
description = "Run the ESP32-S3/Xtensa Rust feasibility gate"
run = ".deskkin/venv/bin/python scripts/gate1c_runner.py run"

[tasks."gate:1d"]
description = "Run the existing CoreS3 Zephyr board-support feasibility gate"
run = ".deskkin/venv/bin/python scripts/gate1d_runner.py run"

[tasks."gate:1e"]
description = "Run the combined CoreS3 Slint feasibility gate"
run = ".deskkin/venv/bin/python scripts/gate1e_runner.py"

[tasks."device:recover"]
description = "Recover a CoreS3 into a recognized inert gate test firmware"
run = ".deskkin/venv/bin/python scripts/device_recover.py"

[tasks."diagnostics:list"]
description = "List bounded local gate diagnostic runs"
run = "python scripts/gate_runner.py list"

[tasks."diagnostics:delete"]
description = "Delete exactly one resolved local gate diagnostic run"
run = "python scripts/gate_runner.py delete"
