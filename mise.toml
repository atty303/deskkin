min_version = "2026.8.6"

[tools]
age = "1.3.1"
actionlint = "1.7.12"
clang = "15.0.7"
"conda:libclang" = "15.0.7"
cmake = "3.28.6"
hk = "1.55.0"
ninja = "1.13.2"
python = "3.12.14"
rust = { version = "1.95.0", components = "clippy,rust-analyzer,rustfmt", targets = "thumbv7m-none-eabi,riscv32i-unknown-none-elf" }
taplo = "0.10.0"
"cargo:espup" = "0.17.1"

[env]
HK_MISE = 1

[hooks]
postinstall = "hk install --mise"

[tool_config]
locked = true

[tasks.check]
description = "Check the repository or selected files"
run = '''
#!/usr/bin/env bash
set -euo pipefail
if (( $# > 0 )); then
  exec hk check --safe -- "$@"
fi
exec hk check --all --safe
'''

[tasks.fix]
description = "Fix the repository or selected files without staging changes"
run = '''
#!/usr/bin/env bash
set -euo pipefail
if (( $# > 0 )); then
  exec hk fix --safe --no-stage -- "$@"
fi
exec hk fix --all --safe --no-stage
'''

[tasks.test]
description = "Run the complete reproducible host and CoreS3 verification"
run = '''
#!/usr/bin/env bash
set -euo pipefail
mise run test:host
mise run test:core-s3
'''

[tasks."test:host"]
description = "Run host, portable, protocol, simulator, and dependency checks"
run = '''
#!/usr/bin/env bash
set -euo pipefail
mise run check
cargo clippy --locked --workspace --all-targets -- -D warnings
cargo test --locked --workspace
cargo run --locked --quiet --bin deskkin-scenario -- periodic-success --recording-off
cargo run --locked --quiet --bin deskkin-scenario -- periodic-read-failure --recording-off
cargo run --locked --quiet --bin deskkin-scenario -- protocol-disconnect-recovery --recording-off
cargo run --locked --quiet --bin deskkin-scenario -- multi-feature-composition --recording-off
cargo check --locked -p application-core --target thumbv7m-none-eabi
cargo check --locked -p application-features --target thumbv7m-none-eabi
cargo check --locked -p deskkin-application --target thumbv7m-none-eabi
cargo check --locked -p deskkin-presentation --target thumbv7m-none-eabi
cargo check --locked -p deskkin-protocol --target thumbv7m-none-eabi
cargo check --locked -p deskkin-protocol-client --target thumbv7m-none-eabi
cargo check --locked -p deskkin-core-s3 --target thumbv7m-none-eabi
DESKKIN_TEST_AGE=1 python -m unittest discover -s tests
cargo tree --locked -p application-core --edges normal
cargo tree --locked -p application-features --edges normal
cargo tree --locked -p deskkin-application --edges normal
cargo tree --locked -p deskkin-presentation --edges normal
cargo tree --locked -p deskkin-host-capabilities --edges normal
cargo tree --locked -p deskkin-protocol --edges normal
'''

[tasks."test:core-s3"]
description = "Verify the prepared CoreS3 toolchain and perform clean product and AMP builds"
run = '''
#!/usr/bin/env bash
set -euo pipefail
python scripts/phase3_device.py build
python scripts/phase3_device.py amp-build
'''

[tasks."simulator:desktop"]
description = "Run the native Linux periodic status simulator"
run = "cargo run --locked --bin deskkin-desktop"

[tasks."simulator:scenario"]
description = "Run a deterministic headless simulator scenario"
run = "cargo run --locked --quiet --bin deskkin-scenario --"

[tasks."simulator:diagnostics"]
description = "Administer bounded local simulator diagnostic runs"
run = "cargo run --locked --quiet --bin deskkin-diagnostics --"

[tasks."protocol:host"]
description = "Run one authenticated desktop-host protocol command"
run = "cargo run --locked --quiet -p deskkin-desktop-host --bin deskkin-desktop-host --"

[tasks."deskkin:profile"]
description = "Manage ignored repeatable physical-host profiles"
run = "cargo run --locked --quiet -p deskkin-desktop-host --bin deskkin-desktop-host -- profile"

[tasks."deskkin:host"]
description = "Run one named physical-host profile in the foreground"
run = "cargo run --locked --quiet -p deskkin-desktop-host --bin deskkin-desktop-host -- profile-host"

[tasks."deskkin:status"]
description = "Read the exact owner state for one physical-host profile"
run = "cargo run --locked --quiet -p deskkin-desktop-host --bin deskkin-desktop-host -- profile-status"

[tasks."deskkin:stop"]
description = "Stop the matching generation of one physical-host profile"
run = "cargo run --locked --quiet -p deskkin-desktop-host --bin deskkin-desktop-host -- profile-stop"

[tasks."protocol:simulator"]
description = "Run one authenticated device-simulator protocol command"
run = "cargo run --locked --quiet -p deskkin-simulator --bin deskkin-desktop --"

[tasks."protocol:diagnostics"]
description = "Administer one exact authenticated-protocol diagnostic store"
run = "cargo run --locked --quiet -p deskkin-simulator --bin deskkin-diagnostics --"

[tasks."core-s3:profile"]
description = "Create the ignored age-encrypted CoreS3 Wi-Fi profile"
run = "python scripts/phase3_device.py profile"

[tasks."core-s3:bootstrap"]
description = "Prepare the repository-local CoreS3 Zephyr and Rust toolchains"
run = "./scripts/bootstrap_core_s3.sh"

[tasks."core-s3:build"]
description = "Build the CoreS3 firmware without touching a device"
run = "python scripts/phase3_device.py build"

[tasks."core-s3:amp-build"]
description = "Build the atlas-free CoreS3 AMP rendering pipeline firmware"
run = "python scripts/phase3_device.py amp-build"

[tasks."core-s3:amp-flash"]
description = "Flash the atlas-free CoreS3 AMP rendering pipeline firmware"
run = "python scripts/phase3_device.py amp-flash"

[tasks."core-s3:amp-benchmark"]
description = "Measure the APPCPU full-screen rendering pipeline through the PROCPU status surface"
run = "python scripts/phase3_device.py amp-benchmark"

[tasks."core-s3:flash"]
description = "Flash the approved CoreS3 firmware after a live checkpoint"
run = "python scripts/phase3_device.py flash"

[tasks."core-s3:identity"]
description = "Run one explicit CoreS3 identity control command"
run = "python scripts/phase3_device.py identity"

[tasks."core-s3:provision"]
description = "Provision one CoreS3 Wi-Fi profile after a live checkpoint"
run = "python scripts/phase3_device.py provision"

[tasks."core-s3:status"]
description = "Read the CoreS3 boot and application status without mutation"
run = "python scripts/phase3_device.py status"

[tasks."core-s3:run"]
description = "Start the already configured CoreS3 application"
run = "python scripts/phase3_device.py run"

[tasks."core-s3:benchmark"]
description = "Run the fixed 60-second CoreS3 Pet rendering benchmark"
run = "python scripts/phase3_device.py benchmark"

[tasks."core-s3:recover"]
description = "Erase CoreS3 storage and restore inert firmware after a live checkpoint"
run = "python scripts/phase3_device.py recover"
