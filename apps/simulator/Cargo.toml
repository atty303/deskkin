[package]
name = "deskkin-simulator"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
deskkin-application = { path = "../../crates/deskkin-application" }
deskkin-desktop-host = { path = "../desktop-host" }
deskkin-protocol = { path = "../../crates/deskkin-protocol" }
deskkin-protocol-client = { path = "../../crates/deskkin-protocol-client" }
deskkin-presentation = { path = "../../crates/deskkin-presentation" }
local-run-recorder = { path = "../../crates/local-run-recorder" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
slint = { version = "=1.17.1", default-features = false, features = ["std", "backend-winit", "renderer-software", "compat-1-2"] }
[build-dependencies]
slint-build = "=1.17.1"

[lints]
workspace = true

[[bin]]
name = "deskkin-desktop"
path = "src/bin/desktop.rs"

[[bin]]
name = "deskkin-scenario"
path = "src/bin/scenario.rs"

[[bin]]
name = "deskkin-diagnostics"
path = "src/bin/diagnostics.rs"
