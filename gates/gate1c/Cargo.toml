[package]
name = "rustapp"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
description = "Deskkin Phase 1 Gate 1C ESP32-S3 Rust ABI feasibility slice"
license = "MIT"
publish = false

[lib]
crate-type = ["staticlib"]

[dependencies]
critical-section = "=1.2.0"
zephyr = "=0.1.0"

[profile.dev]
opt-level = 1

[profile.release]
debug = true
