# SPDX-License-Identifier: MIT

[package]
name = "rustapp"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
description = "Deskkin Phase 1 Gate 1A Rust and Zephyr feasibility slice"
license = "MIT"
publish = false

[lib]
crate-type = ["staticlib"]

[dependencies]
critical-section = "=1.2.0"
embassy-sync = "=0.6.2"
embassy-time = { version = "=0.4.0", features = ["tick-hz-10_000"] }
log = "=0.4.22"
static_cell = "=2.1.1"
zephyr = { version = "=0.1.0", features = ["executor-zephyr", "time-driver"] }

[dependencies.embassy-executor]
version = "=0.7.0"
features = ["log", "task-arena-size-2048"]

[profile.dev]
opt-level = 1

[profile.release]
debug = true
