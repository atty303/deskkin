[workspace]
members = ["apps/simulator", "crates/application-core"]
# Slint-build enables Fontconfig's dlopen path. Resolver 1 shares that feature
# with the hosted Slint runtime, avoiding a compile-time fontconfig-devel
# requirement while retaining runtime discovery on Linux.
resolver = "1"

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.95"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
